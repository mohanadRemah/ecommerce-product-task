<div class="login-container">
  <div class="login-container__card">

    <div class="logo">
      <img class="logo" src="assets/logo.png" alt="ClickTik Logo" />
    </div>

    <h1 class="login-container__card__title">Log in to your account</h1>
    <p class="login-container__card__description">Welcome back! Please enter your details.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="login-container__card__input-fields">

        <label for="username">Email</label>
        <input id="username" type="email" formControlName="username" placeholder="Enter your email"
          [ngClass]="{ 'error': loginForm.get('username')?.invalid && loginForm.get('username')?.touched }" />

        @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
          <span class="error-message">Valid email is required</span>
        }

      </div>

      <div class="login-container__card__input-fields">

        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••"
          [ngClass]="{ 'error': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }"/>

        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <span class="error-message">Password is required</span>
        }

      </div>

      <button type="submit" class="login-container__card__button">
        Sign In
      </button>

    </form>
  </div>
</div>
